<header>
  <div class="announcement-bar">
    <span *ngIf="animate">{{ messages[currentMessageIndex] }}</span>
  </div>

  <nav class="navbar">
    <div class="nav-left">
      <button [routerLink]="" (click)="toggleMenu('TIENDA')">TIENDA</button>
      <button [routerLink]="" (click)="toggleMenu('HOMBRE')">HOMBRE</button>
      <button [routerLink]="" (click)="toggleMenu('MUJER')">MUJER</button>
     <button routerLink="/category-list" routerLinkActive="active" class="menu-link">Category List</button>
     <button routerLink="/product-list" routerLinkActive="active" class="menu-link">product List</button>
 
    </div>



    <div class="logo">DUSK</div>

    <div class="nav-right">
      <div class="search-box">
        <input type="text" placeholder="Buscar...">
        <span class="search-icon">🔍</span>
      </div>
      <span class="icon">👤</span>
      <span class="icon">🛒</span>
    </div>
  </nav>

  <div class="mega-menu" *ngIf="activeMenu">
    <h3>{{ activeMenu }}</h3>
    <ul>
      <li>Novedades</li>
      <li>Más vendidos</li>
      <li>Accesorios</li>
    </ul>
  </div>
</header>
