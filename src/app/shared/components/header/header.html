      ============================================ -->
      <div class="search-box">

        <span class="search-icon icon-mask icon-mask--lupa"></span>
      </div>

    <!-- <div class="logo-container" [routerLink]="['/']">
      <img src="assets/imagenes/Dusck_model_logo.png" alt="Dusck Model Logo" class="brand-logo">
    </div> -->

    <div class="logo-container" [routerLink]="['/']">
      <span class="brand-logo" role="img" aria-label="Dusck Model Logo"></span>
    </div>

    <div class="nav-right">
      <!-- ============================================
           ICONO: Favoritos (corazón)
      ============================================ -->
      <span class="icon icon-mask icon-mask--heart" title="Favoritos"></span>

      <!-- <span class="icon" title="Cuenta">👤</span> -->
      <!-- ============================================
           ICONO: Usuario / Cuenta
           - onAccountIconClick(): si NO hay usuario logueado, abre el modal de login
           - si SÍ hay usuario, abre/cierra el desplegable con "Cerrar sesión"
      ============================================ -->
      <div class="account-wrapper">
        <span class="icon icon-mask icon-mask--user" title="Cuenta" (click)="onAccountIconClick()"></span>

        @if (accountMenuOpen && (httpAuth.user$ | async); as user) {
        <div class="account-dropdown">
          <p class="account-dropdown__greeting">Hola, {{ user.name }}</p>
          <button type="button" class="account-dropdown__logout" (click)="logout()">Cerrar sesión</button>
        </div>
        }
      </div>

       <!-- ============================================
           ICONO: Carrito de compras
           - cartCount viene del componente (por ahora en 0, falta conectar al servicio real)
      ============================================ -->
      <div class="cart-wrapper">
        <span class="icon icon-mask icon-mask--bag" title="Carrito" (click)="onCartIconClick()"></span>
        @if (httpCart.cartCount() > 0) {
          <span class="cart-badge">{{ httpCart.cartCount() }}</span>
        }
      </div>
    </div>
  </nav>
</header>


<!-- Overlay oscuro detrás del drawer -->
<div class="drawer-overlay" *ngIf="drawerOpen" (click)="closeDrawer()"></div>

<!-- Panel lateral de navegación (reemplaza al mega-menú) -->
<aside class="side-drawer" [class.open]="drawerOpen">
  <div class="side-drawer__header">
    <span class="side-drawer__logo">DUSCK</span>
    <button class="side-drawer__close" (click)="closeDrawer()">
      CERRAR <span class="close-x">✕</span>
    </button>
  </div>

  <ul class="side-drawer__list">
    <li><button routerLink="/home" (click)="closeDrawer()">TIENDA</button></li>
    <li><a routerLink="/basicos" [queryParams]="{ categoria: 'hombre' }" routerLinkActive="active" (click)="closeDrawer()">HOMBRE</a></li>
    <li><a routerLink="/basicos" [queryParams]="{ categoria: 'mujer' }" routerLinkActive="active" (click)="closeDrawer()">MUJER</a></li>
    <li><a routerLink="/colecciones" routerLinkActive="active" (click)="closeDrawer()">COLECCIONES</a></li>
    <li><a routerLink="/basicos" routerLinkActive="active" (click)="closeDrawer()">BÁSICOS</a></li>
  </ul>
</aside>

@if (authModalOpen) {
<app-auth-modal [initialTab]="authModalTab" (closed)="closeAuthModal()" />
}
<!-- Panel lateral del carrito, estilo Temu -->
<app-cart-drawer [open]="cartDrawerOpen" (closed)="closeCartDrawer()" />
