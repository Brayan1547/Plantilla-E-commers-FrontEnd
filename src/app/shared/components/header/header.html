<header>
  <!-- Barra de anuncios superior -->
  <div class="announcement-bar">
    <span *ngIf="animate">{{ messages[currentMessageIndex] }}</span>
  </div>


  <!-- Barra de navegación principal -->
  <nav class="navbar">
    <div class="nav-left">
      <button [routerLink]="" (click)="toggleMenu('TIENDA')">TIENDA</button>
      <button [routerLink]="" (click)="toggleMenu('HOMBRE')">HOMBRE</button>
      <button [routerLink]="" (click)="toggleMenu('MUJER')">MUJER</button>
      <a routerLink="/category-list" routerLinkActive="active" class="menu-link">COLECCIONES  </a>
      <a routerLink="/dashboard/product-list" routerLinkActive="active" class="menu-link">BÁSICOS</a>
      
      <!-- <button (click)= "logout()">logout</button> -->
      
      <!-- @if( httpAuth.isLogged() && httpAuth.user; as user){
        <li><button (click)="logout()">logout</button></li>
      }@else {
        <li><a routerLink="/login" routerLinkActive="active">login</a></li>
        <li><a routerLink="/register" routerLink="active">register</a></li>
      } -->
<ul>
  @if ( httpAuth.user$ |async; as user) {
  {{ user.name }}
  {{ user.role }}
  <li><button (click)="logout()">logout</button></li>
  } 
  @else {
  <li><a routerLink="/login" routerLinkActive="active">login</a></li>
  <li><a routerLink="/register" routerLink="active">register</a></li>
  }
</ul>

</div>


    <div class="logo-container" [routerLink]="['/']">
      <img src="assets/imagenes/Dusck_model_logo.png" alt="Dusck Model Logo" class="brand-logo">
    </div>


    <div class="nav-right">
      <div class="search-box">
        <input type="text" placeholder="Buscar...">
        <span class="search-icon">🔍</span>
      </div>
      <span class="icon" title="Cuenta">👤</span>
      <span class="icon" title="Carrito">🛒</span>
    </div>
  </nav>


  <!-- Mega Menú desplegable -->
  <div class="mega-menu" *ngIf="activeMenu">
    <h3>{{ activeMenu }}</h3>
    <ul>
      <li>Novedades</li>
      <li>Más vendidos</li>
      <li>Accesorios</li>
      <li>Denim</li>
    </ul>
  </div>
</header>
