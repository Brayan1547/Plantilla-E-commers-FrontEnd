<div class="container">
    <div class="header">
        <h2>Categorías</h2>
        <button>
            <a routerLink="/category-new" class="btn-new-category"> Nueva Categoría</a>
        </button>
        
    </div>

    <!-- <pre>{{categoryList$ | async | json}}</pre> -->

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Slug</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (category of ( categoryList$ | async); track $index) {
            <tr>
                <td>
                    {{category.name}}
                    <fa-icon [icon]="faCoffee" />
                </td>
                <td>{{category.slug}}</td>
                <td>{{category.description}}</td>
                <td><span class="activo">Activo</span></td>
                <td>
                    <a [routerLink]="['/dashboard/category-edit', category._id]">
                        <fa-icon [icon]="faPenToSquare" />
                        Editar
                    </a>
                    <button (click)="onEdit( category._id)">Editar</button>
                    <button class="onDelete" (click)="onDelete(category._id)">Eliminar</button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
