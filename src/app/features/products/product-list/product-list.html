<div class="page page-product">

    <h2>product List</h2>
    <pre>{{ productList$ | async | json }}</pre>

    <div class="option">
        <a routerLink="/product-new">new product</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>image</th>
                <th>product Name</th>
                <th>status</th>
                <th>actions</th>
            </tr>
        </thead>

        <tbody>
            @for ( product of (productList$ | async ); track $index) {
            <tr>
                <td>
                    <img class="product-image" [src]="product.images" [alt]="product.name" {title}="product.name">
                </td>
                <td>{{product.name}}</td>
                <td>
                    @if( product.isActive) {
                    <hugeicons-icon class="toggle-icon toggle-on-icon" [icon]="ToggleOnIcon" [size]="24" color="currentColor" [strokeWidth]="1.5">
                    </hugeicons-icon>
                    }
                    @else {
                    <hugeicons-icon class="toggle-icon toggle-off-icon" [icon]="ToggleOffIcon" [size]="24" color="#fe0a0a"
                        [strokeWidth]="1.5"></hugeicons-icon>
                    }

                </td>
                <td>
                    <div class="option"></div>
                    <button (click)="onEdit( product._id)">Edit</button>
                    <button (click)="onDelete(product._id)"> Delete</button>
                </td>
            </tr>
            }

        </tbody>
        <tfoot></tfoot>

    </table>

</div>
