<form [formGroup]="formData" (ngSubmit)="onSubmit()" class="auth-form">

  <div class="auth-field">
    <label for="email">Correo electrónico</label>
    <input formControlName="email" type="email" id="email" placeholder="tucorreo@ejemplo.com"
      [class.invalid]="email?.invalid && (email?.dirty || email?.touched)">
    <small class="error">
      @if (email?.invalid && (email?.dirty || email?.touched)) {
        @if (email?.errors?.['required']) { Ingresa tu correo electrónico }
      }
    </small>
  </div>

  <div class="auth-field">
    <label for="password">Contraseña</label>
    <input formControlName="password" type="password" id="password" placeholder="Tu contraseña"
      [class.invalid]="password?.invalid && (password?.dirty || password?.touched)">
    <small class="error">
      @if (password?.invalid && (password?.dirty || password?.touched)) {
        @if (password?.errors?.['required']) { Ingresa tu contraseña }
      }
    </small>
  </div>

  <button type="submit" class="auth-submit" [disabled]="formData.invalid">Iniciar sesión</button>

  <p class="auth-switch">
    ¿No tienes cuenta?
    <button type="button" class="auth-switch__link" (click)="switchToRegister.emit()">Crear una</button>
  </p>

</form>
