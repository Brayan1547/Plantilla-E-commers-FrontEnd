<form [formGroup]="formData" (ngSubmit)="onSubmit()">

    <h2>Registrarse</h2>

    <div>
        <label for="name">Nombre</label>
        <input formControlName="name" type="text" id="name" placeholder="Ej: carlos perez">
        <small class="error">aqui va el mensaje del error</small>
    </div>

    <div>
        <label for="nickname">Nickname</label>
        <input formControlName="nickname" type="text" id="nickname" placeholder="Ej: carlosperez123">
        <small class="error">aqui va el mensaje del error</small>
    </div>

    <div>
        <label for="email">Correo electrónico</label>
        <input formControlName="email" type="email" id="email" placeholder="Ej: tucorreo@ejemplo.com">
        <small class="error">aqui va el mensaje del error</small>
    </div>

    <div>
        <label for="password">Contraseña</label>
        <input formControlName="password" type="password" id="password" placeholder="Tu contraseña">
        <small class="error">aqui va el mensaje del error</small>
    </div>

    <button type="submit">Registrarse</button>

</form>
